<div class="border rounded p-3 mb-3">
  <!-- Titre de la rubrique -->
  <h3 class="mb-3 text-center">Repas</h3>

  <!-- Liste des informations -->
  <ul class="list-group">
    <li class="list-group-item">Information 1</li>
    <li class="list-group-item">Information 2</li>
    <li class="list-group-item">Information 3</li>
  </ul>

  <div class="container mt-4 border rounded">
    <h5 class="mt-2 mb-3 text-center">Ajouter un repas</h5>
    <div class="mb-3">
      <label for="keySelector" class="form-label"
        >Sélectionnez une catégorie :</label
      >
      <select id="keySelector" class="form-select" [(ngModel)]="selectedKey">
        <option *ngFor="let key of objectKeys(repas_V2)" [value]="key">
          {{ key }}
        </option>
      </select>
    </div>

    @if(selectedKey) {
    <table class="table table-striped table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th class="text-center">Lignes</th>
          <th *ngFor="let option of mealOptions" class="text-center">
            {{ option }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ligne of repas_V2[selectedKey]">
          <td class="text-center fw-bold">{{ ligne }}</td>
          <td *ngFor="let option of mealOptions" class="text-center">
            <div class="form-check d-flex justify-content-center">
              <input
                type="checkbox"
                class="form-check-input"
                [checked]="checkedOptions[ligne][option]"
                (change)="toggleCheckbox(ligne, option)"
              />
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    }

    <form (ngSubmit)="onSubmit()">
      <!-- <div class="mb-2">
        <label for="commentaire">Commentaire :</label><br />
        <textarea
          id="commentaire"
          name="commentaire"
          class="form-control"
          rows="4"
          placeholder="Votre commentaire..."
        ></textarea>
      </div> -->

      <div class="d-flex justify-content-end">
        <button type="submit " class="btn btn-primary mb-2">Ajouter</button>
      </div>
    </form>
  </div>
</div>
