<div class="border rounded p-3 mb-3">
  <!-- Titre de la rubrique -->
  <h3 class="mb-3 text-center">Sommeil</h3>

  <table class="table table-striped">
    <thead>
      <tr class="text-center">
        <th scope="col">Début</th>
        <th scope="col">Fin</th>
        <th scope="col">Total</th>
      </tr>
    </thead>
    <tbody>
      @for(sleep of sleepList(); track sleep.id) {
      <tr class="text-center">
        <td>{{ sleep.begin }}</td>
        <td>{{ sleep.end }}</td>
        <td>{{ sleep.begin | timeDiff : sleep.end }}</td>
      </tr>
      }
    </tbody>
  </table>

  <div class="container mt-4">
    <div class="card p-4 shadow-sm">
      <h5 class="card-title text-center mb-3">
        Ajouter une période de sommeil
      </h5>

      <datalist id="times">
        <option *ngFor="let time of timeOptions" [value]="time"></option>
      </datalist>

      <form (ngSubmit)="ajouterPlageHoraire()">
        <div class="row mb-3">
          <div class="col-md-5">
            <label for="debut" class="form-label">Début</label>
            <input
              type="time"
              id="debut"
              class="form-control"
              [(ngModel)]="debut"
              name="debut"
              required
            />
          </div>

          <div class="col-md-5">
            <label for="fin" class="form-label">Fin</label>
            <input
              type="time"
              id="fin"
              class="form-control"
              [(ngModel)]="fin"
              name="fin"
              required
            />
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
      </form>
    </div>
  </div>
</div>
